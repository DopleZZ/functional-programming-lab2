name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Stack root
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-root-${{ hashFiles('**/stack.yaml.lock') }}-${{ hashFiles('**/stack.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-root-

      - name: Cache Stack work
        uses: actions/cache@v4
        with:
          path: lab2/.stack-work
          key: ${{ runner.os }}-stack-work-${{ hashFiles('**/stack.yaml.lock') }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/package.yaml') }}-${{ hashFiles('**/*.hs') }}
          restore-keys: |
            ${{ runner.os }}-stack-work-${{ hashFiles('**/stack.yaml.lock') }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/package.yaml') }}-
            ${{ runner.os }}-stack-work-${{ hashFiles('**/stack.yaml.lock') }}-
            ${{ runner.os }}-stack-work-

      - name: Setup Haskell (Stack)
        uses: haskell/actions/setup@v2
        with:
          enable-stack: true
          stack-version: "latest"

      - name: Build & Test
        working-directory: lab2
        run: |
          stack setup
          stack test --no-interleaved-output
